[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drc-power-analysis"
version = "0.1.0"
description = "Reproducible North Kivu health-facility power analysis"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
