name: Figure 3 publication exports
on:
  workflow_dispatch:
  push:
    paths:
      - 'publication/figure3/**'
      - 'scripts/export_figure3.py'
      - 'scripts/export_timeline_figure.py'
      - 'pyproject.toml'
      - '.github/workflows/figure3-publication.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core libcairo2
      - run: python -m pip install '.[publication]'
      - name: Render audited SVG masters at 3600 DPI
        run: python scripts/export_figure3.py --from-publication --dpi 3600 --release-dir outputs/figure3-publication-3600dpi
      - uses: actions/upload-artifact@v4
        with:
          name: figure3-publication-3600dpi
          path: outputs/figure3-publication-3600dpi/
          retention-days: 30
          if-no-files-found: error
