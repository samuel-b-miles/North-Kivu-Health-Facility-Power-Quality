name: Submission figures and tables
on:
  workflow_dispatch:
  push:
    paths:
      - 'publication/**'
      - 'scripts/build_submission*.py'
      - 'scripts/export_submission_tables.py'
      - 'scripts/build_figure_book.py'
      - 'scripts/run_timeline_figure.py'
      - 'scripts/export_timeline_figure.py'
      - 'scripts/run_health.py'
      - 'config/dhis2_analysis.csv'
      - 'src/drc_power/dhis2*.py'
      - 'data/public/dhis2*'
      - 'pyproject.toml'
      - '.github/workflows/submission-figures-tables.yml'
permissions:
  contents: read
jobs:
  submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core libcairo2
      - run: python -m pip install '.[publication,figures,dev]'
      - run: python -m pytest -q
      - run: python scripts/build_submission_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: submission-figures-and-tables
          path: |
            outputs/generated/submission/submission_figures_and_tables.pdf
            outputs/generated/submission/build_manifest.json
            publication/table2/table2.pdf
            publication/table1/table1.png
            publication/table2/table2.png
            outputs/generated/health/tables/table2_mortality_cluster_intervals.csv
            docs/TABLE2_DESCRIPTIVE_METHODS.md
            publication/table1/source.json
            publication/table1/table1.pdf
            publication/figure2/figure2.*
          retention-days: 30
          if-no-files-found: error
